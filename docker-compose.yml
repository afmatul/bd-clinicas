# Bases de datos locales: 4 instituciones + plataforma (en el mismo PostgreSQL que el hospital).
# Uso: cp .env.example .env && docker compose up -d && npm run db:seed
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      HOSPITAL_DB_PASSWORD: ${HOSPITAL_DB_PASSWORD}
      PLATAFORMA_DB_PASSWORD: ${PLATAFORMA_DB_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/db/postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./infra/db:/schemas:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pediatrico
      PEDIATRICO_DB_PASSWORD: ${PEDIATRICO_DB_PASSWORD}
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/db/mysql-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./infra/db:/schemas:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 30

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      LABORATORIO_DB_PASSWORD: ${LABORATORIO_DB_PASSWORD}
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
      - ./infra/db/laboratorio/mongo-init.js:/docker-entrypoint-initdb.d/00-init.js:ro

  couchdb:
    image: couchdb:3.4
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: ${COUCH_ADMIN_PASSWORD}
    ports: ["5984:5984"]
    volumes:
      - couch-data:/opt/couchdb/data

volumes:
  pg-data:
  mysql-data:
  mongo-data:
  couch-data:
